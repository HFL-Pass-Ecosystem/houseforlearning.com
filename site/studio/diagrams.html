<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagrams and charts | House for Learning Studio</title><link rel="stylesheet" href="../assets/fonts/fonts.css"><link rel="stylesheet" href="studio.css"></head><body>
<main><h1>Diagrams and charts</h1><p class="lead">Describe a process in plain text and see the flowchart. Or paste a table of numbers and see the chart.</p>
<h2>Flowchart from text</h2>
<div class="two"><div><textarea id="m">flowchart LR
  A[Learner signs up] --> B[Takes lesson]
  B --> C{Passes quiz?}
  C -- Yes --> D[Certificate issued]
  C -- No --> B</textarea><div class="bar"><button id="mr">Draw</button><button class="alt" id="ms">Save SVG</button></div></div>
<div class="stage" id="mo"></div></div>
<h2>Chart from your data</h2>
<div class="two"><div><textarea id="d">Month,Learners,Completed
Jan,120,80
Feb,180,130
Mar,260,210
Apr,340,300</textarea>
<div class="bar"><select id="ct"><option>bar</option><option>line</option><option>pie</option><option>doughnut</option></select><button id="cr">Draw</button><button class="alt" id="cs">Save PNG</button></div></div>
<div class="stage"><canvas id="cc" height="260"></canvas></div></div>
<p class="note">Everything runs inside your browser. Engines: Mermaid (MIT), Chart.js (MIT), Papa Parse (MIT).</p></main>
<script src="vendor/mermaid.min.js"></script><script src="vendor/chart.umd.js"></script><script src="vendor/papaparse.min.js"></script><script src="studio.js"></script>
<script src="diagrams-app.js"></script></body></html>
