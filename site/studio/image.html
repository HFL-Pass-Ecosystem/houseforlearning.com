<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image editor | House for Learning Studio</title><link rel="stylesheet" href="../assets/fonts/fonts.css"><link rel="stylesheet" href="studio.css"></head><body>
<main><h1>Image editor</h1><p class="lead">Open a photo, add layers, crop and adjust. Export at full resolution.</p>
<div class="bar"><label class="btn">Open image<input type="file" id="f" accept="image/*" hidden></label>
<button class="alt" id="addtxt">Add text</button><button class="alt" id="addrect">Add shape</button><button class="alt" id="del">Delete layer</button><button class="alt" id="up">Bring forward</button><button class="alt" id="crop">Crop to selection</button>
<button id="png">Export PNG</button><button class="alt" id="jpg">Export JPEG</button></div>
<div class="two"><div class="stage"><canvas id="c" width="900" height="600"></canvas></div>
<div class="side"><b>Adjust</b>
<label>Brightness</label><input type="range" id="br" min="-100" max="100" value="0">
<label>Contrast</label><input type="range" id="co" min="-100" max="100" value="0">
<label>Saturation</label><input type="range" id="sa" min="-100" max="100" value="0">
<label>Blur</label><input type="range" id="bl" min="0" max="20" value="0">
<label><input type="checkbox" id="gr"> Greyscale</label>
<label>Resize longest side (px)</label><input type="number" id="rs" value="1600" class="sx7">
<button class="alt sx1" id="rsb">Resize canvas</button>
<label>Layers</label><div id="layers" class="sx8"></div></div></div>
<div id="drop" class="drop sx9">Or drop an image here</div>
<p class="note">Everything runs inside your browser. Engine: Fabric.js (MIT).</p></main>
<script src="vendor/fabric.min.js"></script><script src="studio.js"></script>
<script src="image-app.js"></script></body></html>
