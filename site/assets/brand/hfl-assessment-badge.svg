<circle cx="450" cy="390" r="310" fill="none" stroke="#f8fafc" stroke-width="5"/>
<circle cx="450" cy="390" r="263" fill="none" stroke="#08a99a" stroke-width="13"/>
<!-- Issuer name sits clear of both ring strokes -->
<rect x="190" y="164" width="520" height="58" rx="29" fill="#0b3151" stroke="#f5a800" stroke-width="3"/>
<text x="450" y="203" text-anchor="middle" fill="#f8fafc" font-family="Georgia,'Times New Roman',serif" font-size="29" font-weight="700" letter-spacing="1.4">HOUSE FOR LEARNING</text>
<!-- Decorative credential dots -->
<circle cx="450" cy="98" r="20" fill="#f5a800" stroke="#fff" stroke-width="5"/>
<circle cx="157" cy="498" r="20" fill="#f5a800" stroke="#fff" stroke-width="5"/>
<circle cx="743" cy="498" r="20" fill="#f5a800" stroke="#fff" stroke-width="5"/>
<!-- Shield and ascending check -->
<g filter="url(#shadow)">
  <path d="M450 267 C493 300 546 312 591 319 V416 C591 487 542 538 450 576 C358 538 309 487 309 416 V319 C354 312 407 300 450 267 Z" fill="url(#teal)" stroke="#f5a800" stroke-width="13" stroke-linejoin="round"/>
  <path d="M375 420 L430 473 L532 361" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- CAP identity plate -->
<rect x="230" y="585" width="440" height="78" rx="18" fill="#f5a800" stroke="#fff" stroke-width="5"/>
<text x="450" y="618" text-anchor="middle" fill="#062643" font-family="Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="1">CAP™</text>
<text x="450" y="647" text-anchor="middle" fill="#062643" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">CHARTERED DEPLOYMENT</text>
<!-- Process ribbon: distinct lower field, no text crosses a ring or the tick -->
<path d="M127 704 H773 V926 L690 958 L450 1084 L210 958 L127 926 Z" fill="url(#navy)" stroke="#f5a800" stroke-width="10" stroke-linejoin="round"/>
