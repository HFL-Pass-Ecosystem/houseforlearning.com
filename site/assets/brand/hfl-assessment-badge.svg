<text x="450" y="776" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing=".5">AUTHOR · TRAIN WITH HCF™</text>
<text x="450" y="824" text-anchor="middle" fill="#f5a800" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing=".3">LEARN WITH PMP · EARN WITH PWP</text>
<text x="450" y="868" text-anchor="middle" fill="#e6f1f7" font-family="Arial,sans-serif" font-size="18" font-weight="600" letter-spacing=".5">PMP · PHYGITAL MARKETPLACE</text>
<text x="450" y="898" text-anchor="middle" fill="#e6f1f7" font-family="Arial,sans-serif" font-size="18" font-weight="600" letter-spacing=".5">PWP · PHYGITAL WORKPLACE</text>
</svg>
