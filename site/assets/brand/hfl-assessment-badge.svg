<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
<title id="title">House for Learning CAP™ Chartered Deployment badge</title>
<desc id="desc">House for Learning issuer seal. CAP™ Chartered Deployment. Author and train with HCF™; learn with PMP, the Phygital Marketplace; earn with PWP, the Phygital Workplace.</desc>
<defs>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b3151"/><stop offset="1" stop-color="#041b32"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14b8a6"/><stop offset="1" stop-color="#087c78"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#031526" flood-opacity=".25"/></filter>
</defs>
