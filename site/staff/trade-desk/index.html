<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HUMI Trade Desk</title>
<link rel="stylesheet" href="desk.css">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">


<div class="wrap">
 <header>
  <div class="row"><h1 id="h1"></h1><span class="demo">Demo data only</span></div>
  <div class="row" role="group" aria-label="Business">
   <span id="sites" class="row"></span>
   <button id="theme" aria-label="Switch light or dark">◐</button>
  </div>
 </header>
 <nav class="tabs" aria-label="Views">
  <button data-tab="customer">Customer view</button>
  <button data-tab="crm">CRM: orders</button>
  <button data-tab="erp">ERP: offer terms</button>
  <button data-tab="fx">Money: FX and cover</button>
  <button data-tab="ship">Delivery and insurance</button>
  <button data-tab="mis">MIS board</button>
  <button data-tab="rules">Incoterms</button>
 </nav>
 <main id="view"></main>
 <p class="muted">All rates, prices, freight, premiums and duties on this page are made up for testing. None is a live rate or a real quote. Price list in USD; each customer sees their own currency. <span id="note"></span></p>
</div>
<script src="data.js"></script>
<script src="desk.js"></script>
</body>
</html>
