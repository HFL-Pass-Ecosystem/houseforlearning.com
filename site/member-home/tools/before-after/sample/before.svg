<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Sample room before the makeover">
<defs>
<linearGradient id="bw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9ae98"/><stop offset="1" stop-color="#a59a84"/></linearGradient>
<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d5a48"/><stop offset="1" stop-color="#57473a"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb4c2"/><stop offset="1" stop-color="#c9d2d2"/></linearGradient>
</defs>
<!-- shell: same walls and same camera in both pictures -->
<polygon points="0,0 1600,0 1300,150 300,150" fill="#c9c0ad"/>
<polygon points="0,0 300,150 300,680 0,1000" fill="#a89d87"/>
<polygon points="1600,0 1300,150 1300,680 1600,1000" fill="#9c917c"/>
<rect x="300" y="150" width="1000" height="530" fill="url(#bw)"/>
<polygon points="0,1000 300,680 1300,680 1600,1000" fill="url(#fl)"/>
<!-- worn carpet marks -->
<ellipse cx="620" cy="860" rx="150" ry="38" fill="#4b3d32" opacity=".55"/>
<ellipse cx="1050" cy="800" rx="90" ry="22" fill="#4b3d32" opacity=".45"/>
<ellipse cx="380" cy="930" rx="110" ry="26" fill="#7a6753" opacity=".5"/>
<!-- skirting -->
<rect x="300" y="664" width="1000" height="16" fill="#8a7e69"/>
<polygon points="0,1000 300,680 300,664 0,975" fill="#857964"/>
<polygon points="1600,1000 1300,680 1300,664 1600,975" fill="#7d725e"/>
<!-- wall cracks and damp patch -->
<path d="M1180 150 l-14 60 l18 40 l-22 70 l10 46" fill="none" stroke="#7f745f" stroke-width="4"/>
<path d="M330 420 l26 34 l-10 48 l22 40" fill="none" stroke="#7f745f" stroke-width="3"/>
<ellipse cx="1010" cy="205" rx="120" ry="40" fill="#958a73" opacity=".7"/>
<!-- window (same place in both pictures) -->
<rect x="420" y="230" width="340" height="290" fill="#6f6553"/>
<rect x="434" y="244" width="312" height="262" fill="url(#sky)"/>
<rect x="586" y="244" width="8" height="262" fill="#6f6553"/>
<rect x="434" y="371" width="312" height="8" fill="#6f6553"/>
<!-- heavy dark curtains -->
<rect x="396" y="212" width="388" height="14" fill="#4d4237"/>
<path d="M400 226 h120 c-6 110 10 220 -8 330 h-112 z" fill="#5d4638"/>
<path d="M780 226 h-120 c6 110 -10 220 8 330 h112 z" fill="#5d4638"/>
<path d="M430 226 v330 M465 226 v330 M495 226 v330 M690 226 v330 M722 226 v330 M752 226 v330" stroke="#4a372c" stroke-width="5" fill="none"/>
<!-- door on the right wall -->
<polygon points="1400,306 1500,303 1500,893 1400,787" fill="#7b6a56"/>
<polygon points="1412,322 1488,320 1488,872 1412,776" fill="none" stroke="#655644" stroke-width="5"/>
<circle cx="1420" cy="560" r="7" fill="#3d342a"/>
<!-- bare bulb -->
<line x1="800" y1="60" x2="800" y2="170" stroke="#3c342b" stroke-width="4"/>
<rect x="790" y="168" width="20" height="18" fill="#3c342b"/>
<ellipse cx="800" cy="205" rx="20" ry="24" fill="#f1e2a6"/>
<!-- old sofa -->
<rect x="820" y="470" width="400" height="120" rx="14" fill="#6b4a36"/>
<rect x="800" y="520" width="60" height="150" rx="14" fill="#5d3f2e"/>
<rect x="1180" y="520" width="60" height="150" rx="14" fill="#5d3f2e"/>
<rect x="850" y="565" width="340" height="80" rx="10" fill="#7a5640"/>
<line x1="1020" y1="565" x2="1020" y2="645" stroke="#5d3f2e" stroke-width="4"/>
<rect x="850" y="640" width="340" height="40" fill="#5d3f2e"/>
<rect x="840" y="680" width="16" height="22" fill="#33291f"/><rect x="1184" y="680" width="16" height="22" fill="#33291f"/>
<path d="M930 600 l40 10 l-12 22" fill="none" stroke="#4d3526" stroke-width="5"/>
<!-- stack of boxes -->
<rect x="330" y="600" width="130" height="110" fill="#9a7a52"/><rect x="345" y="520" width="100" height="80" fill="#a88758"/>
<line x1="395" y1="600" x2="395" y2="710" stroke="#7d623f" stroke-width="5"/><line x1="395" y1="520" x2="395" y2="600" stroke="#86693f" stroke-width="5"/>
<!-- small crooked picture -->
<g transform="rotate(-6 1010 330)"><rect x="960" y="290" width="100" height="80" fill="#4f4538"/><rect x="970" y="300" width="80" height="60" fill="#8d8571"/></g>
</svg>
