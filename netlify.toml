# Netlify: the House for Learning (houseforlearning.com) site.
# Frontend = the site/ folder (static pages). Middleware = netlify/functions (small server code at /api/...).
# Backend = a Supabase Postgres database (see supabase/schema.sql). Secrets live in Netlify environment
# variables, never in this repository. Free tiers of Netlify and Supabase cover this site.

[build]
  publish = "site"
  functions = "netlify/functions"
  command = "echo 'Static site, no build step'"

[functions]
  node_bundler = "esbuild"

# /api/messages -> netlify/functions/messages.mjs, and so on
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# the yoga chapter's old address
[[redirects]]
  from = "/learning/yoga"
  to = "/yoga.html"
  status = 301
[[redirects]]
  from = "/learning/yoga/"
  to = "/yoga.html"
  status = 301

# Member home and career tree (test): same public sign-in values, served by a small function.
[[redirects]]
  from = "/member-home/config.js"
  to = "/.netlify/functions/member-config"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; media-src 'self' blob:; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://himuywvqgzbzlurifyet.supabase.co https://api.open-meteo.com https://geocoding-api.open-meteo.com https://archive-api.open-meteo.com https://date.nager.at https://api.wikimedia.org; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
