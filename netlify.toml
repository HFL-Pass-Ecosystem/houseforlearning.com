# Netlify: the House for Learning (houseforlearning.com) site. AHFL side only.
# Frontend = the site/ folder (static pages). Middleware = netlify/functions (small server code at /api/...).
# Backend = a Supabase Postgres database (see supabase/schema.sql). Secrets live in Netlify environment
# variables, never in this repository. Free tiers of Netlify and Supabase cover this site.

[build]
  publish = "site"
  functions = "netlify/functions"
  command = "echo 'Static site, no build step'"

[functions]
  node_bundler = "esbuild"

# /api/messages -> netlify/functions/messages.mjs, and so on
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# the yoga chapter's old address
[[redirects]]
  from = "/learning/yoga"
  to = "/yoga.html"
  status = 301
[[redirects]]
  from = "/learning/yoga/"
  to = "/yoga.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
